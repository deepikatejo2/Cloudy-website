<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
  <title>Home Page</title>
  <style>
    body {
      background-color: aliceblue;
      font-family: Quicksand;
      padding-top: 120px;
    }
    .navbar {
      display: flex;
      align-items: center;
      padding: 20px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50px;
      background-color: rgb(154, 197, 224);
    }
    .logo-container {
      width: 45px;
      height: 45px;
      margin: 0 20px;
    }
    .cloud-img {
      height: 45px;
      width: 45px;
    }
    .company-name {
      flex: 1;
      color: black;
      font-size: 30px;
      font-weight: 600;
    }
    .home, .services, .order {
      color: black;
      width: 100px;
      font-weight: 600;
      font-size: 18px;
    }
  </style>
  {% block styles %}{% endblock %}
</head>
<body>
  <div class="navbar">
    <div class="logo-container"><img class="cloud-img" src="{{url_for('static', filename = 'cloud.png')}}" alt="logo"></div>
    <div class="company-name">Cloudy</div>
    <a href="{{url_for('home')}}" class="home">Home</a>
    <a href="{{url_for('services')}}" class="services">Services</a>
    <a href="{{url_for('order')}}" class="order">Order</a>
  </div>
  {% block content %}
  {% endblock %}
</body>
</html>
